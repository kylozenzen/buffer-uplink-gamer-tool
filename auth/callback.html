<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Linking Buffer… — Uplink</title>
  <meta name="theme-color" content="#080b12">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Rajdhani:wght@600;700&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --bg:#080b12; --panel:#111824; --line:#29364a; --text:#e8eef6; --muted:#8795a8; --signal:#74f6d4; --live:#ff4d6d; --amber:#ffc35c; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:radial-gradient(circle at 50% 0%, rgba(116,246,212,.12), transparent 45%), var(--bg); color:var(--text); font-family:'Space Grotesk', system-ui, sans-serif; }
    .card { width:min(100%, 440px); padding:32px 28px; border:1px solid var(--line); border-radius:14px; background:var(--panel); text-align:center; box-shadow:0 30px 80px rgba(0,0,0,.45); }
    .eyebrow { color:var(--signal); font:600 11px/1 'JetBrains Mono', monospace; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:14px 0 8px; font:700 34px/1 'Rajdhani', sans-serif; letter-spacing:.02em; text-transform:uppercase; }
    p { margin:0; color:var(--muted); line-height:1.55; }
    .bars { display:flex; gap:5px; justify-content:center; align-items:flex-end; height:34px; margin:4px 0 18px; }
    .bars i { width:6px; border-radius:2px; background:var(--signal); animation:pulse 1s ease-in-out infinite; }
    .bars i:nth-child(1){height:30%} .bars i:nth-child(2){height:55%;animation-delay:.1s} .bars i:nth-child(3){height:80%;animation-delay:.2s} .bars i:nth-child(4){height:100%;animation-delay:.3s} .bars i:nth-child(5){height:65%;animation-delay:.4s}
    @keyframes pulse { 50% { opacity:.25 } }
    .done .bars i { animation:none; }
    .error .bars i { background:var(--live); animation:none; opacity:.6; }
    .cancelled .bars i { background:var(--amber); animation:none; opacity:.6; }
    a.btn { display:inline-block; margin-top:22px; padding:12px 18px; border-radius:9px; background:var(--signal); color:#05100e; font:700 13px/1 'JetBrains Mono', monospace; text-decoration:none; text-transform:uppercase; letter-spacing:.06em; }
    @media (prefers-reduced-motion: reduce) { .bars i { animation:none; } }
  </style>
</head>
<body>
  <main class="card" id="card">
    <div class="eyebrow">Uplink // Buffer</div>
    <h1 id="title">Linking Buffer…</h1>
    <div class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <p id="msg">Finishing the secure handshake. One second.</p>
    <p id="actions" hidden><a class="btn" href="/">Back to Uplink</a></p>
  </main>
  <script src="/js/shared/connection.js"></script>
  <script src="/js/shared/oauth.js"></script>
  <script src="/js/config.js"></script>
  <script>
    (async () => {
      const card = document.getElementById('card');
      const C = await window.UPLINK_CONFIG_READY;
      const r = await BufferOAuth.handleCallback({ prefix: C.prefix, tokenEndpoint: C.tokenEndpoint, clientId: C.BUFFER_CLIENT_ID });
      if (r.ok) {
        // Mark the app as connected through sign-in (see OAUTH_MARKER in app.js).
        try { localStorage.setItem('uplink_buffer_key', 'oauth'); } catch {}
        card.classList.add('done');
        document.getElementById('title').textContent = 'Signal locked';
        document.getElementById('msg').textContent = 'Buffer is connected. Taking you to the launch deck…';
        let target = '/';
        try { const u = new URL(r.returnTo || '/', location.origin); if (u.origin === location.origin) target = u.pathname; } catch {}
        setTimeout(() => location.replace(`${target}?connected=buffer`), 600);
        return;
      }
      card.classList.add(r.reason === 'cancelled' ? 'cancelled' : 'error');
      document.getElementById('title').textContent = r.reason === 'cancelled' ? 'No worries' : 'Link failed';
      document.getElementById('msg').textContent = r.message;
      document.getElementById('actions').hidden = false;
    })();
  </script>
</body>
</html>
